<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oseg.dev | zlox</title>
    <style>
      body {
        font-family: monospace;
        margin: 0;
        padding: 1rem;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #111;
          color: #eee;
        }
      }
    </style>
  </head>
  <body>
    <main style="display: flex; flex-direction: column; align-items: center">
      <h1>Zlox</h1>
      <h2>Bytes used: <span id="output-count">0</span></h2>
      <div id="terminal" style="max-width: 800px; width: stretch"></div>
      <script type="module">
        import { instantiate } from "./zlox";
        import { WTerm } from "@wterm/dom";
        import "@wterm/dom/css";

        const term = new WTerm(document.getElementById("terminal"), {
          cursorBlink: true,
          onData: handleInput,
        });
        await term.init();

        term.write(`An online REPL for implementation of Lox in Zig!\r\n`);

        const decoder = new TextDecoder();

        term.write("Loading zlox...");

        const zlox = await instantiate({
          stdout(bytes) {
            const str = decoder.decode(bytes);
            console.log(str);
            term.write(str.replaceAll("\n", "\r\n"));
            updateBytesUsed();
          },
        });

        function updateBytesUsed() {
          document.getElementById("output-count").textContent =
            zlox.bytesUsed();
        }

        term.write(" done!\n\n\r");

        let currentLine = "";
        let brackets = 0;
        const PROMPT = "zlox > ";

        term.write(PROMPT);

        // Input processor state machine
        function handleInput(data) {
          for (let i = 0; i < data.length; i++) {
            const char = data[i];

            // Don't eval while there are open brackets.
            if (char === "{") brackets++;
            if (char === "}") brackets--;

            if (char === "\r" || char === "\n") {
              // --- ENTER KEY ---
              term.write("\r\n");

              if (currentLine.trim().length > 0 && !brackets) {
                try {
                  const result = zlox.interpret(currentLine);
                  if (result) {
                    term.write(zlox.error(result) + "\r\n");
                  }
                } catch (error) {
                  // Write out compilation or runtime errors in ANSI red
                  term.write(
                    `\x1b[31mError: ${error.message || error}\x1b[0m\r\n`,
                  );
                }
                updateBytesUsed();
              }

              if (brackets) {
                term.write("   ... ");
              } else {
                currentLine = "";
                term.write(PROMPT);
              }
            } else if (char === "\x7f" || char === "\b") {
              // --- BACKSPACE KEY ---
              if (currentLine.length > 0) {
                currentLine = currentLine.slice(0, -1);
                term.write("\b \b"); // Move back, overwrite with space, move back again
              }
            } else {
              // --- PRINTABLE CHARACTERS ---
              currentLine += char;
              term.write(char); // Manually echo character back onto the screen
            }
          }
        }
      </script>
    </main>
  </body>
</html>
